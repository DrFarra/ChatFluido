name: ChatFluido
options:
  bundleIdPrefix: com.emilio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  ChatFluido:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.chatfluido
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChatFluido
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true # permite 120 Hz en iPhone (SPEC §6)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate

  ChatFluidoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emilio.chatfluido.tests
    info:
      path: Tests/Info.plist

schemes:
  ChatFluido:
    build:
      targets:
        ChatFluido: all
        ChatFluidoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatFluidoTests
    archive:
      config: Release
